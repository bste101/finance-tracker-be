version: "2"

sql:
  - engine: "postgresql"

    queries:
      - "db/query/"

    schema:
      - "db/migrations/"

    gen:
      go:
        package: "sqlc"
        out: "db/sqlc"

        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true

        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"

          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"

          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"